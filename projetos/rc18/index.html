async function saveEntrega(reenviar){
  harvestEntrega(); const d=state.entDraft;
  if(!d.cadocId||!d.periodo){ toast("Informe o regulatório e a data-base.",true); return; }
  if((d.retorno&&d.retorno!=="aguardando")&&!d.enviadoEm){ toast("Informe a data de envio antes de registrar o retorno.",true); return; }
  if(d.problemas.some(p=>!(p.descricao||"").trim())){ toast("Descreva cada problema ou remova a linha vazia.",true); return; }
  const dup=Store.data.entregas.find(e=>e.id!==d.id&&e.cadocId===d.cadocId&&e.periodo===d.periodo&&(e.remessa||1)===d.remessa);
  if(dup){ toast(`Já existe a remessa ${d.remessa} desta data-base. Use outro número ou edite a existente.`,true); return; }
  const id=d.id||"en_"+uid(); const data={...d}; delete data.id; data.atualizadoEm=new Date().toISOString();
  try{
    await Store.put("entregas",id,data); const c=getCad(d.cadocId)||{};
    await Store.log(d.id?"Alteração":"Inclusão","Entrega",`${c.codigo||"?"} · ${d.periodo}`,`Remessa ${d.remessa}, retorno: ${RETORNO[d.retorno||"aguardando"]}`);
    state.dirty=false; toast("Entrega salva");
    if(reenviar){ const base=entregaBase(d.cadocId,d.periodo); state.entDraft={...base,remessa:d.remessa+1,prazo:d.prazo}; dlgEntrega(); }
    else{ closeDlg(); render(); }
  }catch(e){ fail(e); }
}

const blank=v=>!String(v??"").trim();

function cdRows(){
  const f=state.cd; const q=f.q.trim().toLowerCase(); const out=[];
  sortedAll().forEach(c=>{
    if(f.cad&&c.id!==f.cad) return;
    Store.dicOf(c).forEach(x=>{
      const t=x.idAtributo&&Store.get("glossario",glId(x.idAtributo)); const gdef=!!(t&&!blank(t.definicaoNegocio));
      if(q&&![x.idAtributo,x.nomeNegocio,x.nomeFisico,x.tabela,x.coluna,x.sistemaOrigem,x.descricaoTecnica,x.dominio,c.codigo].join(" ").toLowerCase().includes(q)) return;
      if(f.sis==="__pend"){ if(!blank(x.sistemaOrigem)) return; } else if(f.sis&&x.sistemaOrigem!==f.sis) return;
      if(f.obrig&&x.obrigatoriedade!==f.obrig) return;
      if(f.pend==="origem"&&!blank(x.sistemaOrigem)&&!blank(x.tabela)&&!blank(x.coluna)) return;
      if(f.pend==="fisico"&&!blank(x.nomeFisico)) return;
      if(f.pend==="desc"&&!blank(x.descricaoTecnica)) return;
      if(f.pend==="gloss"&&gdef) return;
      out.push({c,x,gdef});
    });
  });
  return out;
}

function cgRows(){
  const f=state.cg; const q=f.q.trim().toLowerCase(); const used=usedIdx(); const out=[];
  Store.data.glossario.forEach(t=>{
    const usado=[...new Set([...(used[t.id]||[]),...(t.relatorios||[]),...(t.mapeamentos||[]).map(m=>m.cadoc)])].sort((a,b)=>a.localeCompare(b,"pt-BR",{numeric:true}));
    if(q&&![t.id,t.idOriginal,t.nome,t.nomeAlternativo,t.definicaoNegocio,t.formulaCalculo,t.dominio,t.ownerNome,t.stewardNome,t.areaResponsavel].join(" ").toLowerCase().includes(q)) return;
    if(f.cad&&!usado.includes(f.cad)) return;
    if(f.own==="__sem"){ if(!blank(t.ownerNome)) return; } else if(f.own&&t.ownerNome!==f.own) return;
    if(f.pend==="def"&&!blank(t.definicaoNegocio)) return;
    if(f.pend==="calc"&&!blank(t.formulaCalculo)) return;
    if(f.pend==="owner"&&!blank(t.ownerNome)) return;
    if(f.pend==="steward"&&!blank(t.stewardNome)) return;
    if(f.pend==="semuso"&&usado.length) return;
    out.push({t,usado});
  });
  return out.sort((a,b)=>String(a.t.id).localeCompare(String(b.t.id),"pt-BR",{numeric:true}));
}
function orfaos(){
  const out=new Map();
  sortedAll().forEach(c=>Store.dicOf(c).forEach(f=>{ if(f.idAtributo&&!Store.get("glossario",glId(f.idAtributo))){ const o=out.get(f.idAtributo)||{id:f.idAtributo,nome:f.nomeNegocio||f.nomeFisico||"",cads:new Set()}; o.cads.add(c.codigo); out.set(f.idAtributo,o); } }));
  return [...out.values()];
}

    g+=`<path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 0 0 ${x3} ${y3}Z" style="fill:var(--brand);opacity:${[.95,.72,.5][i%3]}"><title>${esc(d.n)}: ${esc(d.d)}</title></path><text x="${tx}" y="${(Number(ty)+dy).toFixed(1)}" text-anchor="${anc}" style="fill:var(--ink);font:600 13px 'Public Sans',sans-serif">${d.n}</text>`;
  });
  g+=`<text x="${cx}" y="${cy+6}" text-anchor="middle" style="fill:var(--ink);font:700 44px 'Public Sans',sans-serif">12</text><text x="${cx}" y="${cy+30}" text-anchor="middle" style="fill:var(--ink-2);font:500 13px 'Public Sans',sans-serif">dimensões da qualidade</text>`;
  return `<svg viewBox="0 0 560 560" role="img" aria-label="As 12 dimensões da qualidade da informação" style="width:100%;height:auto;display:block">${g}</svg>`;
}

/* ═════════ Glossário: mapeamento termo x CADOC ═════════ */
function parseMap(txt){
  const out=[]; const seen=new Set();
  String(txt||"").split("|").forEach(tok=>{
    const re=/(^|\s)([A-Za-z]{0,4}\d{2,4}[A-Za-z]?):/g; const idx=[]; let m;
    while((m=re.exec(tok))) idx.push({i:m.index+m[1].length,code:m[2],after:m.index+m[0].length});
    idx.forEach((x,k)=>{ const end=k+1<idx.length?idx[k+1].i:tok.length; const campo=tok.slice(x.after,end).trim(); const key=x.code+"|"+campo; if(campo&&!seen.has(key)){ seen.add(key); out.push({cadoc:x.code,campo}); } });
  });
  return out;
}

  if(!plano.size){ toast("Nenhum termo do glossário tem mapeamento no formato CADOC:campo em “Nome alternativo”.",true); return; }

/* ---- regras de severidade, prazo e escalonamento ---- */
function xClassify(r){
  const c=xcfg(), why=[]; let lv=0; const up=(n,t)=>{ if(n>lv) lv=n; why.push(t); };
  const dv=xnum(r.desvioPct), at=xnum(r.atrasoDias);
  if(r.rejeitadoBCB==="Sim") up(2,"Informação rejeitada ou com substituição determinada pelo BCB");
  if(r.tipo==="Crítica ou apontamento do BCB") up(1,"Apontamento do BCB");
  if(dv>=c.desvioCritico) up(2,`Desvio de ${dv}% ≥ limiar crítico (${c.desvioCritico}%)`); else if(dv>=c.desvioRelevante) up(1,`Desvio de ${dv}% ≥ limiar relevante (${c.desvioRelevante}%)`);
  if(at>=c.atrasoCritico) up(2,`Atraso de ${at} dia(s) ≥ limiar crítico (${c.atrasoCritico})`); else if(at>=c.atrasoRelevante) up(1,`Atraso de ${at} dia(s) ≥ limiar relevante (${c.atrasoRelevante})`);
  if(r.tipo==="Retificação após envio"||r.tipo==="Reenvio ou substituição"){ if(r.crit==="Alta") up(2,"Retificação ou reenvio de CADOC de criticidade alta"); else if(r.crit==="Média") up(1,"Retificação ou reenvio de CADOC de criticidade média"); }
  return {lv,lab:["Baixa","Relevante","Crítica"][lv],cls:["baixo","medio","alto"][lv],prazoDias:[c.prazoBaixo,c.prazoRelevante,c.prazoCritico][lv],why};
}
function xNorm(it){
  const o=it.src==="ent"?it.p:it.r, c=it.c;
  const cl=xClassify({tipo:it.tipo,desvioPct:o.desvioPct,atrasoDias:it.atraso,rejeitadoBCB:it.rejeitado?"Sim":"Não",crit:c&&c.criticidade});
  const prazo=o.prazoSolucao||addDays(it.ident,cl.prazoDias);
  const resolvido=it.status==="Resolvido", vencido=!resolvido&&prazo<today();
  return {...it,o,cl,prazo,resolvido,vencido,escalar:vencido&&o.planoAcao!==X_PLANO_OK,comunicar:o.corrigidoAntesEnvio==="Não"&&o.comunicadoBCB!=="Sim"};
}

function xField(f,v,ro){

  if(f.t==="select") return `<select ${a}><option value=""></option>${f.opts.map(o=>`<option${o===val?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
  if(f.t==="sel2") return `<select ${a}>${f.pairs.map(([k,t])=>`<option value="${k}"${k===val?" selected":""}>${esc(t)}</option>`).join("")}</select>`;
  if(f.t==="cad") return `<select ${a}><option value="">Selecione</option>${sortedAll().map(c=>`<option value="${esc(c.id)}"${c.id===val?" selected":""}>${esc(c.codigo)} – ${esc(String(c.nome||"").slice(0,60))}</option>`).join("")}</select>`;
  if(f.t==="dim") return `<select ${a}><option value=""></option>${DIMS.map(d=>`<option value="${d.k}"${d.k===val?" selected":""}>${d.n}</option>`).join("")}</select>`;
  if(f.t==="checks"){ const cur=Array.isArray(v)?v:[]; return `<div class="checks" id="x_${f.k}" data-xc="${f.k}">${f.opts.map(o=>`<label class="check"><input type="checkbox" value="${esc(o)}"${cur.includes(o)?" checked":""}${ro}> ${esc(o)}</label>`).join("")}</div>`; }
  if(f.t==="date") return `<input type="date" ${a} value="${esc(val)}">`;
  if(f.t==="number") return `<input type="number" min="0" step="any" ${a} value="${esc(val)}">`;
  return `<input type="text" ${a} value="${esc(val)}">`;
}
function xGrid(fields,vals,ro){ return `<div class="grid">${fields.map(f=>`<div${f.wide?` class="wide"`:""}><label for="x_${f.k}">${esc(f.l)}${f.req?" *":""}${f.hint?` <span class="hint">(${esc(f.hint)})</span>`:""}</label>${xField(f,vals[f.k],ro)}</div>`).join("")}</div>`; }
function xHarvest(fields){

async function xSanSave(){
  const {ref,avulso,fields,it}=state.xsan||{}; if(!fields) return;

    if(avulso){

    toast("Salvo"); closeDlg(); render();
  }catch(err){ xFail(err); }
}

  const h=["CADOC","Problema","Dimensão","Severidade","Prazo","Situação","Plano ao Conselho","Comunicação ao BCB"];
  const rows=items.map(r=>`| ${c(xcadCod(r.cadocId))} | ${c(r.descricao)} | ${c(xDimN(r.dimensao))} | ${r.cl.lab} | ${fmtDate(r.prazo)} | ${r.resolvido?"Resolvido":"Em aberto"} | ${c(r.o.planoAcao||"Não necessário")} | ${r.o.corrigidoAntesEnvio==="Não"?c(r.o.comunicadoBCB||"Não"):"Não se aplica"} |`);
  return `## 7. Saneamento e escalonamento (RC 18, art. 3º, VI)\n${items.length} problema(s) ou incidente(s) no período: ${items.filter(r=>r.resolvido).length} resolvido(s), ${items.filter(r=>!r.resolvido).length} em aberto, ${items.filter(r=>r.cl.lv===2).length} de severidade crítica; ${items.filter(r=>r.escalar).length} com plano ao Conselho pendente; ${items.filter(r=>r.comunicar).length} a comunicar ao BCB.\n\n| ${h.join(" | ")} |\n|${h.map(()=>"---").join("|")}|\n${rows.length?rows.join("\n"):"| Nenhum registro no período |"+" |".repeat(h.length-1)}\n\n## 8. Testes prévios e atestações dos owners\n${att.length} atestação(ões) no período, ${att.filter(a=>!X_ATT.every(x=>(a.checks||[]).includes(x))||a.excecoes).length} com exceções; ${xAttPend().length} CADOC de criticidade alta ou média sem atestação no mês corrente.\n\n## 9. Terceiros, planilhas e mudanças\nTerceiros com lacunas: ${terc.filter(r=>XM.terc.gaps(r)>0).length} de ${terc.length}. Planilhas e ajustes manuais sem todos os controles: ${euc.filter(r=>XM.euc.gaps(r)>0).length} de ${euc.length}. Mudanças no período: ${mud.length}, ${mud.filter(XM.mud.pend).length} sem reavaliação completa.\n\n`;
}


/* ---- Indicadores gerais (painel no formato do dashboard) e cobertura do dicionário e do glossário ---- */
function xbars(items,color){
  const max=Math.max(1,...items.map(i=>i[1]));
  return items.length?items.map(([n,v])=>`<div class="hb"><span class="lb" title="${esc(n)}">${esc(n)}</span><div class="tr"><i style="width:${(v/max*100).toFixed(1)}%;background:${color}"></i></div><span class="v">${v}</span></div>`).join(""):`<p class="muted">Sem dados ainda.</p>`;
}
function xTermCad(){
  const m=new Map();
  Store.data.glossario.forEach(t=>{ const ms=(t.mapeamentos&&t.mapeamentos.length)?t.mapeamentos:parseMap(t.nomeAlternativo); new Set(ms.map(x=>String(x.cadoc))).forEach(code=>{ if(!m.has(code)) m.set(code,new Set()); m.get(code).add(t.id); }); });
  return m;
}
function xCover(){
  const cads=Store.items, gl=Store.data.glossario, tc=xTermCad();
  const all=cads.map(c=>({c,f:Store.dicOf(c)}));
  const campos=all.flatMap(x=>x.f), nf=campos.length;
  const has=v=>String(v||"").trim()!=="";
  const used=new Set(campos.filter(f=>has(f.idAtributo)).map(f=>glId(f.idAtributo)));
  const termosMap=gl.filter(t=>(t.mapeamentos&&t.mapeamentos.length)||parseMap(t.nomeAlternativo).length).length;
  return {nc:cads.length,esc:emEscopo().length,comDic:all.filter(x=>x.f.length).length,nf,nt:gl.length,
   origem:pct(campos.filter(f=>has(f.sistemaOrigem)&&has(f.tabela)).length,nf),
   desc:pct(campos.filter(f=>has(f.descricaoTecnica)).length,nf),
   vinc:pct(campos.filter(f=>f.idAtributo&&Store.get("glossario",glId(f.idAtributo))).length,nf),
   def:pct(gl.filter(t=>has(t.definicaoNegocio)).length,gl.length),
   cls:pct(gl.filter(t=>has(t.classificacaoInformacao)&&has(t.classificacaoLgpd)).length,gl.length),
   map:pct(termosMap,gl.length),
   fora:gl.filter(t=>!used.has(glId(t.idOriginal||t.id))&&!used.has(glId(t.id))).length,tc};
}
function xIndRows(){
  const q=(state.x.q.ind||"").toLowerCase(), fv=state.x.f.ind||"", tc=xTermCad();
  let rows=sortedAll().map(c=>{ const f=Store.dicOf(c), co=completude(c); return {c,n:f.length,co,tn:(tc.get(String(c.codigo))||new Set()).size}; });
  if(q) rows=rows.filter(r=>[r.c.codigo,r.c.nome,r.c.grupo,r.c.area].join(" ").toLowerCase().includes(q));
  if(fv==="sem") rows=rows.filter(r=>!r.n);
  else if(fv==="inc") rows=rows.filter(r=>r.n&&(r.co.origem<100||r.co.glossario<100));
  else if(fv==="ok") rows=rows.filter(r=>r.n&&r.co.origem>=100&&r.co.glossario>=100);
  return rows.sort((a,b)=>b.n-a.n||String(a.c.codigo).localeCompare(String(b.c.codigo),"pt-BR",{numeric:true}));
}
function xIndTable(){
  const rows=xIndRows();
  if(!rows.length) return `<div class="panel empty"><h2>Nada encontrado</h2><p>Nenhum regulatório corresponde à busca ou ao filtro.</p></div>`;
  return `<div class="tablewrap"><table><thead><tr><th>CADOC</th><th>Nome</th><th class="num">Campos</th><th class="num">Termos no glossário</th><th class="num">Origem preenchida</th><th class="num">Glossário vinculado</th><th>Situação</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td class="code">${esc(r.c.codigo)}</td><td>${esc(r.c.nome)}</td><td class="num">${r.n}</td><td class="num">${r.tn}</td><td class="num">${r.n?r.co.origem+"%":"—"}</td><td class="num">${r.n?r.co.glossario+"%":"—"}</td><td><span class="chip s-neutral">${esc(r.c.situacao||"—")}</span></td><td class="rowact"><button class="btn link sm" data-act="irDic" data-id="${esc(r.c.id)}">Dicionário</button></td></tr>`).join("")}</tbody></table></div>`;
}
function vIndGer(){
  const k=xCover(), cads=Store.items;
  if(!cads.length) return `<div class="head"><div><h1>Indicadores gerais</h1><p>Panorama dos regulatórios, do dicionário de dados e do glossário.</p></div></div><div class="panel empty"><h2>Nenhum regulatório cadastrado</h2><p>Carregue o catálogo em Carga e importação para ver os indicadores.</p></div>`;
  const kp=(l,n,cls)=>`<div class="kpi ${cls||""}"><b>${n}</b><span>${l}</span></div>`;
  const porGrupo=[...groupBy(cads,c=>c.grupo||c.area||"Sem grupo").entries()].map(([g,a])=>[g,a.length]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const camposCad=sortedAll().map(c=>[c.codigo,Store.dicOf(c).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const termosCad=[...k.tc.entries()].map(([code,set])=>[code,set.size]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const cov=(l,v,extra)=>`<tr><td>${l}</td><td style="width:45%"><div class="prog" style="margin:.2rem 0"><i style="width:${v}%;background:var(--brand)"></i></div></td><td class="num">${v}%</td><td class="muted small">${extra||""}</td></tr>`;
  return `<div class="head"><div><h1>Indicadores gerais</h1><p>Panorama dos regulatórios (CADOC), do dicionário de dados e do glossário. Os números vêm dos cadastros desta aplicação e se atualizam a cada alteração.</p></div></div>
  <section class="panel"><h2>Resumo executivo</h2><div class="kpis" style="margin:.8rem 0 0">${kp("Regulatórios cadastrados",k.nc)}${kp("No escopo (ativo ou em implantação)",k.esc)}${kp("Com dicionário",k.comDic)}${kp("Campos no dicionário",k.nf)}${kp("Termos no glossário",k.nt)}${kp("Termos fora de qualquer dicionário",k.fora,k.fora?"warn":"")}</div></section>
  <div class="cols2"><section class="panel"><h2>Regulatórios por grupo</h2><div style="margin-top:.7rem">${xbars(porGrupo,"var(--yellow)")}</div></section>
  <section class="panel"><h2>Campos no dicionário por regulatório</h2><div style="margin-top:.7rem">${xbars(camposCad,"var(--lime)")}</div></section></div>
  <div class="cols2"><section class="panel"><h2>Termos do glossário por regulatório</h2><div style="margin-top:.7rem">${xbars(termosCad,"var(--yellow)")}</div></section>
  <section class="panel"><h2>Cobertura do dicionário e do glossário</h2><div class="tablewrap" style="margin-top:.7rem"><table><tbody>
   ${cov("Regulatórios com dicionário",pct(k.comDic,k.nc),`${k.comDic} de ${k.nc}`)}
   ${cov("Campos com sistema de origem e tabela",k.origem)}
   ${cov("Campos com descrição técnica",k.desc)}
   ${cov("Campos ligados a um termo do glossário",k.vinc)}
   ${cov("Termos com definição de negócio",k.def)}
   ${cov("Termos com classificação da informação e LGPD",k.cls)}
   ${cov("Termos mapeados a algum regulatório",k.map)}
  </tbody></table></div></section></div>
  <section class="panel"><h2>Detalhamento</h2>
   <div class="filters" style="margin-top:.7rem"><div class="grow"><label for="xq_ind">Buscar</label><input id="xq_ind" type="search" value="${esc(state.x.q.ind||"")}"></div>
    <div><label for="xf_ind">Mostrar</label><select id="xf_ind">${[["","Todos"],["sem","Sem dicionário"],["inc","Dicionário incompleto"],["ok","Origem e glossário completos"]].map(([v,t])=>`<option value="${v}"${(state.x.f.ind||"")===v?" selected":""}>${t}</option>`).join("")}</select></div></div>
   <div id="xlist">${xIndTable()}</div></section>`;
}


/* ---- Resumo executivo (cartões, gráficos e pendências da governança RC 18) ---- */
function vResumo(){
  const sc=emEscopo(), it=xItems(), ab=it.filter(r=>!r.resolvido), ve=ab.filter(r=>r.vencido);
  const semResp=sc.filter(c=>!String(c.responsavel||"").trim()).length;
  const terc=xr("rc18_terc"), euc=xr("rc18_euc"), mud=xr("rc18_mud"), pl=xr("rc18_plano");
  const dias=Math.ceil((PRAZO_ADEQUACAO-new Date())/86400000);
  const kp=(l,n,cls)=>`<div class="kpi ${cls||""}"><b>${n}</b><span>${l}</span></div>`;
  const tl=terc.filter(t=>XM.terc.gaps(t)>0).length;
  const porDim=DIMS.map(d=>[d.n,it.filter(r=>r.dimensao===d.k).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const sev=["Crítica","Relevante","Baixa"].map(n=>[n,ab.filter(r=>r.cl.lab===n).length]);
  const crit=CRIT.map(n=>[n,sc.filter(c=>c.criticidade===n).length]);
  const stp=["Concluído","Em andamento","Não iniciado","Bloqueado"].map(n=>[n,pl.filter(p=>p.status===n).length]);
  const todo=[];
  it.filter(r=>r.escalar).forEach(r=>todo.push(["saneamento",`Plano de ação ao Conselho pendente: ${r.descricao}`]));
  it.filter(r=>r.comunicar&&!r.resolvido).forEach(r=>todo.push(["saneamento",`Comunicar ao BCB (art. 9º): ${r.descricao}`]));
  if(semResp) todo.push(["cadocs",`${semResp} regulatório${semResp>1?"s":""} no escopo sem responsável`]);
  const semDic=sc.filter(c=>!Store.dicOf(c).length).length; if(semDic) todo.push(["dicionario",`${semDic} regulatório${semDic>1?"s":""} no escopo sem dicionário de dados`]);
  if(tl) todo.push(["terc",`${tl} terceiro${tl>1?"s":""} com lacunas de contrato, SLA ou monitoramento`]);
  const el=euc.filter(e=>XM.euc.gaps(e)>0).length; if(el) todo.push(["euc",`${el} planilha${el>1?"s":""} ou ajuste${el>1?"s":""} sem todos os controles`]);
  const mp=mud.filter(XM.mud.pend).length; if(mp) todo.push(["mud",`${mp} mudança${mp>1?"s":""} concluída${mp>1?"s":""} sem reavaliação completa`]);
  const ap=xAttPend().length; if(ap) todo.push(["atest",`${ap} regulatório${ap>1?"s":""} de criticidade alta ou média sem atestação neste mês`]);
  const prox=pl.filter(p=>p.status!=="Concluído").sort((a,b)=>String(a.prazo).localeCompare(String(b.prazo))).slice(0,6);
  return `<div class="head"><div><h1>Resumo executivo</h1><p>Situação da política de qualidade da informação frente à Resolução Conjunta nº 18/2025. ${dias>0?`Faltam ${dias} dia${dias>1?"s":""} para o prazo de adequação, em 31/12/2026 (art. 12).`:"O prazo de adequação, 31/12/2026 (art. 12), já terminou."}</p></div></div>
  <section class="panel"><div class="kpis" style="margin:0">${kp("Regulatórios no escopo",sc.length)}${kp("No escopo sem responsável",semResp,semResp?"warn":"")}${kp("Problemas em aberto",ab.length)}${kp("Saneamento vencido",ve.length,ve.length?"bad":"")}${kp("Terceiros com lacunas",tl,tl?"warn":"")}${kp("Dias até 31/12/2026",Math.max(dias,0),dias<=30?"warn":"")}</div></section>
  <div class="cols2"><section class="panel"><h2>Problemas por dimensão</h2><div style="margin-top:.7rem">${xbars(porDim,"var(--yellow)")}</div></section>
  <section class="panel"><h2>Problemas em aberto por severidade</h2><div style="margin-top:.7rem">${xbars(sev,"var(--yellow)")}</div></section></div>
  <div class="cols2"><section class="panel"><h2>Regulatórios no escopo por criticidade</h2><div style="margin-top:.7rem">${xbars(crit,"var(--lime)")}</div></section>
  <section class="panel"><h2>Marcos do plano por situação</h2><div style="margin-top:.7rem">${xbars(stp,"var(--lime)")}</div></section></div>
  <section class="panel"><h2>O que precisa de ação</h2>${todo.length?`<ul class="attn" style="margin-top:.7rem">${todo.map(t=>`<li><span>${esc(t[1])}</span><button class="btn link sm" data-act="nav" data-v="${t[0]}">Abrir</button></li>`).join("")}</ul>`:`<p class="muted" style="margin-top:.7rem">Nada pendente com os dados atuais.</p>`}</section>
  <section class="panel"><h2>Próximos marcos do plano</h2>${prox.length?`<div class="tablewrap" style="margin-top:.7rem"><table><thead><tr><th>Marco</th><th>Responsável</th><th>Prazo</th><th>Situação</th></tr></thead><tbody>${prox.map(p=>`<tr><td>${esc(p.marco)}</td><td>${esc(p.responsavel||"—")}</td><td>${p.prazo<today()?xchip(fmtDate(p.prazo)+" (atrasado)","alto"):fmtDate(p.prazo)}</td><td>${esc(p.status)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted" style="margin-top:.7rem">Nenhum marco pendente. Carregue ou cadastre o plano em “Plano até 31/12/2026”.</p>`}</section>`;
}

/* ---- ações e eventos ---- */

  xSeed:async()=>{ try{ let n=0; for(const p of X_PLANO){ n++; await Store.put("rc18_plano","m"+pad2(n),{marco:p[0],responsavel:p[1],prazo:p[2],status:"Não iniciado",obs:""}); } toast("Plano sugerido carregado"); render(); }catch(e){ xFail(e); } },
  xCritSave:async()=>{ const o={}; Object.keys(X_CFG).forEach(k=>{ const el=$("#xc_"+k); o[k]=el?xnum(el.value):X_CFG[k]; }); try{ await Store.put("rc18_config","criterios",o); await Store.log("Alteração","Critérios de severidade","",JSON.stringify(o)); toast("Critérios salvos"); render(); }catch(e){ xFail(e); } },
  xCritReset:()=>{ Object.keys(X_CFG).forEach(k=>{ const el=$("#xc_"+k); if(el) el.value=X_CFG[k]; }); toast("Sugestões restauradas. Clique em Salvar critérios para aplicar."); },
  xSanNew:()=>xSanDlg(null), xSanOpen:el=>xSanDlg(el.dataset.ref), xSanSave:()=>xSanSave(),
  xSanDel:el=>{ const ref=el.dataset.ref; dlgConfirm("Excluir incidente avulso?","A exclusão não pode ser desfeita.","Excluir",async()=>{ try{ await Store.del("rc18_inc",ref); await Store.log("Exclusão","Incidente avulso","",ref); closeDlg(); render(); toast("Excluído"); }catch(e){ xFail(e); } }); },
  xSanEnt:el=>{ closeDlg(); abrirEntregaDe(el.dataset.id,el.dataset.per); },
  xAttNew:()=>xAttDlg(xme(),null), xAttOpen:el=>xAttDlg(el.dataset.uid,el.dataset.id), xAttSave:el=>xAttSave(el.dataset.id), xAttDel:el=>{ const id=el.dataset.id; dlgConfirm("Excluir esta atestação?","A exclusão não pode ser desfeita.","Excluir",()=>xAttDel(id)); }
});
document.addEventListener("input",ev=>{
  const t=ev.target; if(!t||!t.id) return;

  else if(t.dataset&&t.dataset.xs){ xSim()[t.dataset.xs]=t.value; const o=$("#xsimOut"); if(o) o.innerHTML=xSimOut(); }
});
document.addEventListener("change",ev=>{
  const t=ev.target; if(!t||!t.id) return;
  if(t.id==="xsan"){ state.x.san=t.value; const box=$("#xlist"); if(box) box.innerHTML=xSanTable(); }
  else if(t.id.startsWith("xf_")){ const k=t.id.slice(3); state.x.f[k]=t.value; const box=$("#xlist"); if(box) box.innerHTML=k==="ind"?xIndTable():xListHtml(k); }
  else if(t.dataset&&t.dataset.xs){ xSim()[t.dataset.xs]=t.value; const o=$("#xsimOut"); if(o) o.innerHTML=xSimOut(); }

/* submenus do menu lateral: ao mudar de grupo, abre o grupo da página e fecha os demais; os cabeçalhos abrem e fecham à mão */
function navSync(cur){
  if(!state.navOpen) state.navOpen=new Set();
  if(state.navLast!==cur){
    state.navLast=cur; const gi=NAV.findIndex(g=>g.i.some(([k])=>k===cur));

}

}

};
